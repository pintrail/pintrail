# Production overlay. Applied on top of compose.yml:
#
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# What it changes: Caddy terminates TLS in front, the database and object
# store stop being reachable from outside the host, and every credential comes
# from the environment rather than a literal in the file.
#
# Required in .env (or the shell) -- the stack refuses to start without them:
#   PINTRAIL_DOMAIN, POSTGRES_PASSWORD, S3_* , PUBLIC_BASE_URL
#
# If you point S3_* at real S3 or R2, drop the minio services entirely:
#   docker compose -f compose.yml -f compose.prod.yml up -d --scale minio=0

x-app-env: &prod-app-env
  DATABASE_URL: postgres://pintrail:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pintrail
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  RUST_LOG: ${RUST_LOG:-pintrail_api=info,pintrail_worker=info,warn}

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # No host port. The database is reachable only on the compose network.
    ports: !override []

  minio:
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    ports: !override []

  minio-init:
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'bucket ready'
      "
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}

  api:
    environment:
      <<: *prod-app-env
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      # With real S3 or R2, leave this unset -- the one S3 endpoint is already
      # public. With bundled MinIO, set it to a host that clients can reach
      # (e.g. an object-store subdomain Caddy also fronts); minio:9000 is
      # internal-only and would leave every presigned URL unresolvable.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      # Session cookies must never travel in clear.
      COOKIE_SECURE: "true"
      # Caddy is the only thing that reaches the API, and it rewrites
      # X-Forwarded-For. Without this every client would share one rate-limit
      # bucket, because the only address the API would see is Caddy's.
      TRUST_PROXY_HEADERS: "true"
      MAILER: ${MAILER:-log}
    # Only Caddy talks to it.
    ports: !override []

  worker:
    environment:
      <<: *prod-app-env
      WORKER_POLL_INTERVAL_SECS: ${WORKER_POLL_INTERVAL_SECS:-5}

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PINTRAIL_DOMAIN: ${PINTRAIL_DOMAIN:?set PINTRAIL_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # ACME account and certificates; losing this
      - caddy-config:/config  # re-issues certs and can hit rate limits
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
