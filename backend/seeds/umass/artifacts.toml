lng = -72.5295812
tags = ["stormwater", "landscape", "native plants"]
sources = ["explorer:f42cb093-a8c4-4028-aedc-f99a3ccfceca"]
description = """
The five-acre pedestrian heart of the Southwest Residential Area, among the residence towers and dining commons that house about 5,000 students, rebuilt in 2011.

How it works: the redesign brought back native trees and plants, and shapes the ground so that rain flows into planted low areas and soaks in naturally, managing stormwater with very little maintenance."""

[[artifact.link]]
url = "https://www.umass.edu/planning-design-construction/book/southwest-concourse-renovation-2011"
note = "The Southwest Concourse renovation (2011)"

[[artifact]]
