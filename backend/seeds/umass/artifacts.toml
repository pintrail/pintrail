check = "Confirm the garden is still here and add a current source page; the 2018 record has none."
description = """
A garden made in 2016 by Landscape Management and students from the Stockbridge School of Agriculture, with plants chosen to attract bees, butterflies and hummingbirds, and a water source for them.

Why it matters: pollinators are in decline, and they need food, water and shelter close together. The garden is registered with the Million Pollinator Garden Challenge, a national campaign to create that kind of habitat."""

[[artifact.link]]
url = "https://www.umass.edu/sustainability/operations-and-infrastructure/energy"
note = "UMass Green Grounds: native plants, no synthetic pesticides on 90% of managed areas"

[[artifact]]
key = "green-grounds"
name = "Green Grounds: campus landscape care"
topic = true
tags = ["landscape", "native plants", "pesticide free"]
sources = []
description = """
UMass Amherst holds a Gold-level Green Grounds Certification from Re:wild Your Campus. At least 90% of the campus's managed grounds are cared for without synthetic pesticides or fertilizers, native plants are favored, landscape water use is kept down, and synthetic chemicals are being reduced on sports fields.

Why it matters: it makes the whole campus landscape safer for people, pollinators and the water that runs off it."""

[[artifact.link]]
url = "https://www.umass.edu/sustainability/operations-and-infrastructure/energy"
note = "Gold-level Green Grounds Certification"

