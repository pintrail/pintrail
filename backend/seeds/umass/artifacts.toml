[[artifact]]
key = "campus-pond"
name = "Campus Pond"
lat = 42.3894463
lng = -72.526458
tags = ["water", "stormwater", "landscape", "wildlife"]
sources = ["osm:relation/1763353", "explorer:ba723ae9-9ddc-425d-861d-f16d6e898bf6"]
check = "Add a source for the 2015 restoration; the 2018 record has none."
description = """
The pond at the center of campus, between the Student Union, the Campus Center and the Fine Arts Center.

Why it matters: it is part of the campus stormwater system, even though it was never engineered to collect storm runoff. In 2015 Landscape Management began restoring it: native plants along the shore to protect wildlife habitat, and natural logs along the banks to stop erosion, both to improve the water quality. With the storm drains already at capacity, much of the newer campus landscaping (rain gardens, green roofs, reuse of rainwater) is designed to keep runoff and the pollutants it carries out of the pond."""

[[artifact.link]]
url = "https://www.umass.edu/planning-design-construction/book/infrastructure-and-sustainability"
note = "The Campus Pond's role in the stormwater system"

[[artifact.link]]
url = "https://www.openstreetmap.org/relation/1763353"
note = "Location (OpenStreetMap)"

