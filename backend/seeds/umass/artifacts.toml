check = "Confirm ValleyBike is operating and which UMass stations exist today; the 2018 data lists five."
description = """
ValleyBike is the Pioneer Valley's regional electric-assist bike share, launched in June 2018 by UMass Amherst, the Pioneer Valley Planning Commission and several towns and cities, with five stations on campus at the start. Riders unlock a bike at one station and return it at another, which makes short trips across campus and into town possible without a car.

UMass Amherst is a Bicycle Friendly University (League of American Bicyclists), and ValleyBike is one part of that, alongside the Bike Co-op and the student bike share.

Look for the station locations that link to this page."""

