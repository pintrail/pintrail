[[artifact]]
key = "central-heating-plant"
name = "Central Heating Plant"
lat = 42.3899555
lng = -72.5370959
tags = ["energy", "heating and cooling", "combined heat and power", "building"]
sources = ["explorer:941eeb88-b4b1-4568-ad6d-c24b0932ae11", "osm:way/149698359"]
description = """
The campus power and steam plant on Mullins Way, completed in 2009.

Why it matters: it makes electricity for about 70% of the campus and all of the steam used to heat and cool campus buildings. Producing electricity and heat in one place (combined heat and power) gets far more out of each unit of fuel than buying electricity and running separate boilers. Since it opened, it has helped cut campus greenhouse gas emissions by about 27%.

Look for the systems listed under this building."""

[[artifact.link]]
url = "https://www.umass.edu/facilities/utilities"
note = "What the plant supplies to campus"

[[artifact]]
key = "chp-solar-hot-water"
name = "Solar hot water at the Central Heating Plant"
parent = "central-heating-plant"
tags = ["energy", "solar", "solar thermal"]
topics = [{ key = "topic-campus-solar", note = "Solar heat rather than solar electricity" }]
sources = []
description = """
A solar hot water system added to the Central Heating Plant in 2016.

How it works: sun-warmed fluid preheats the condensate water the plant turns back into steam. Water that starts warmer needs less fuel to boil, so the plant burns less natural gas for the same steam.

Location: no coordinates of its own; it inherits them from the plant."""

[[artifact.link]]
url = "https://www.umass.edu/sustainability/operations-and-infrastructure/energy"
note = "Solar hot water at the CHP, added 2016"

[[artifact]]
key = "chp-reclaimed-water"
name = "Reclaimed water at the Central Heating Plant"
parent = "central-heating-plant"
tags = ["water", "energy", "reclaimed water"]
sources = ["explorer:bd950bdb-d226-4efc-a7cb-f04d2f5af166", "explorer:036d76df-d804-4bbc-a7c8-1ed7adfb3934"]
check = "Confirm the system is still in use and whether reclaimed water now also irrigates campus grounds (a 2018 permit extension allowed it)."
description = """
Much of the water the Central Heating Plant turns into steam, and the water for its cooling towers, is not drinking water. It is reclaimed water from the Amherst Wastewater Treatment Plant, cleaned further by reverse osmosis before it goes into the boilers.

Why it matters: a power plant uses a lot of water. Using treated wastewater for that industrial job leaves more of the town's drinking water for drinking. In summer, when less steam is needed, Landscape Management has used the surplus to water newly planted campus trees.

Location: no coordinates of its own; it inherits them from the plant."""

[[artifact.link]]
url = "https://www.umass.edu/facilities/utilities"
note = "Campus utilities, including the Central Heating Plant"

[[artifact]]
key = "north-energy-exchange-center"
name = "North Energy Exchange Center"
lat = 42.3944394
lng = -72.5316667
tags = ["energy", "heating and cooling", "geothermal", "energy storage", "building"]
sources = ["osm:way/704071839", "explorer:a77a30c5-4022-4c64-aa47-8786f07aca44"]
check = "The NEEC and the North Chiller Plant (2017) appear to share this site; confirm how to present them, and the well count and tank size."
description = """
The heart of the campus's new low-carbon heating and cooling system in the engineering area of north campus.

How it works: a regional field of geothermal wells uses the ground for seasonal energy storage, exchanging heat with the earth across the seasons, and a thermal energy storage tank holds chilled water to cover the daily peaks in cooling demand.

Why it matters: it is part of how the campus is moving away from burning fossil fuels for heating and cooling, on the way to its carbon-zero goal. The Computer Sciences Laboratories (2025) uses it to avoid fossil fuels.

The site also holds the North Chiller Plant (2017), built with glass walls at ground level so passers-by can see a working chiller plant."""

[[artifact.link]]
url = "https://www.umass.edu/sustainability/operations-and-infrastructure/green-building-projects"
note = "NEEC: ground-source well field for seasonal storage and a TES tank"

[[artifact.link]]
url = "https://www.umass.edu/planning-design-construction/book/north-chiller-plant-2017"
note = "North Chiller Plant (2017), LEED NC v2009 Silver"

