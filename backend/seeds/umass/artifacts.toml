# UMass sustainability artifacts: the curated seed (issue #81).
#
# This file is the deliverable. generate_sql.py turns it into SQL; see
# README.md for how to fetch, curate, generate and load.
#
# Every description is written in our own words. The facts come from the
# pages listed under each artifact's links, which load as the artifact's
# source links. UMass's own text and photos are not copied (the sources state
# no license). A "check" line is a note for the fact checker: something to
# confirm before the artifact is approved in production. Delete it once done.
#
# Fields:
#   key          stable id; never change it once loaded (the database id is
#                derived from it). lowercase-with-dashes.
#   name         as people on campus would call it
#   lat, lng     only on things with their own location. Something inside a
#                building leaves them out and names the building as parent,
#                so it inherits the building's location.
#   parent       key of the building or site it belongs to
#   topic        true for a shared page that other artifacts link to
#   topics       [{ key = "...", note = "..." }] topics this artifact links to
#   tags         lowercase words people would search for
#   sources      where the record came from (candidate ids from
#                build_candidates.py); for provenance, not loaded
#   check        open question for the fact checker; not loaded
#   description  what it is, why it matters, how it works
#   [[artifact.link]]  url and a short note on what it is the source for
#
# Kind is always "other" for now, with tags carrying the type (#56).

# ===========================================================================
# Topics: shared pages that several artifacts link to
# ===========================================================================

[[artifact]]
key = "topic-campus-solar"
name = "Solar power at UMass Amherst"
topic = true
tags = ["energy", "solar"]
sources = ["explorer:41bef75f-de95-44b8-892e-6b7639f5737a"]
description = """
UMass Amherst generates electricity from about 10 megawatts of solar panels spread across campus: on the roofs of five buildings and on canopies over parking lots, plus a solar array on the university farm in South Deerfield.

Why it matters: the campus solar is enough to power roughly 1,400 Massachusetts homes. Power the panels make can be used on campus, fed into the grid, or stored in the two campus battery systems.

How it grew: the first parking canopy went up at the Robsham Visitor Center in 2016. In 2016 and 2017 a larger round added rooftop arrays and two big canopies, about 5 megawatts, bought through a power purchase agreement: a company owns the panels and UMass buys all the electricity they make. More canopies have been added since.

Look for the rooftop arrays and canopies that link to this page."""

[[artifact.link]]
url = "https://www.umass.edu/sustainability/operations-and-infrastructure/energy"
note = "Current totals: about 10 MW on five rooftops and five-plus parking lots, two batteries, homes equivalent"

[[artifact]]
key = "topic-permaculture"
name = "UMass Permaculture gardens"
topic = true
tags = ["food", "gardens", "permaculture"]
sources = ["explorer:51"]
description = """
Permaculture is a way of designing gardens that work like natural ecosystems: layers of fruit trees, shrubs, perennials and ground cover that feed each other and need little outside input once they are established.

UMass Permaculture, started in 2010, turns underused campus lawns into edible, educational gardens. Students, staff and volunteers build and tend them, and some of the produce goes to campus dining.

Look for the individual gardens that link to this page."""

[[artifact.link]]
url = "https://www.umass.edu/sustainability/operations-and-infrastructure/food-and-permaculture"
note = "UMass Permaculture: founded 2010, built by students, staff and volunteers"

[[artifact]]
key = "topic-leed"
name = "LEED certification"
topic = true
tags = ["green building", "leed"]
sources = []
description = """
LEED (Leadership in Energy and Environmental Design) is the U.S. Green Building Council's rating system for green buildings. A project earns points for energy and water efficiency, materials, indoor air quality and the site, and its total sets the level: Certified, Silver, Gold or Platinum.

Why it matters: a LEED rating is checked by a third party, so it is evidence that a building was designed and built to use less energy and water than a typical one.

UMass Amherst has many LEED buildings. The Computer Sciences Laboratories (2025) is the campus's first Platinum building. Each linked building's note gives its level and the LEED version it was rated under."""

[[artifact.link]]
url = "https://www.umass.edu/sustainability/operations-and-infrastructure/green-building-projects"
note = "UMass green building projects, including the first LEED Platinum building"

[[artifact]]
key = "topic-ev-charging"
name = "Electric vehicle charging on campus"
topic = true
tags = ["transportation", "ev charging"]
sources = ["explorer:496bf488-79fe-4c95-89b8-ae7f2ec2ca9d"]
description = """
Several campus parking lots and the Campus Center Parking Garage have Level 2 chargers for electric cars, operated by ChargePoint and open to students, faculty, staff and visitors.

In 2014, UMass Amherst installed the first Level 3 fast charger in Massachusetts, which can charge a car to 80% in about 30 minutes. The university's own fleet is switching to electric vehicles too, with fleet chargers at the Physical Plant paid for by a $175,000 state grant.

Look for the charging locations that link to this page."""

[[artifact.link]]
url = "https://www.umass.edu/sustainability/operations-and-infrastructure/transportation"
note = "Level 2 ChargePoint chargers; fleet chargers from a $175,000 MA DOER grant"

[[artifact]]
