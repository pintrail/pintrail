{% extends "studio_base.html" %}
{% block content %}
<div class="signin">
  <div class="brand" style="margin-bottom:1rem;font-size:1.1rem"><span class="dot"></span> Pintrail Studio</div>
  <div class="card">
    <h3>Sign in</h3>
    {% if error %}<p class="flash err">{{ error }}</p>{% endif %}
    <form method="post" action="/studio/login">
      <label class="field"><span class="lbl">Email</span>
        <input type="email" name="email" autocomplete="username" required autofocus></label>
      <label class="field"><span class="lbl">Password</span>
        <input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn-primary" style="width:100%">Sign in</button>
    </form>
    <p class="hint">Authoring accounts are provisioned from the command line. Editors and admins can create and edit; viewers can browse.</p>
  </div>
</div>
{% endblock %}
