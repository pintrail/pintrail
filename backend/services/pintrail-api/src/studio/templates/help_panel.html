{# A manual page in the slide-in help panel. Links to other manual pages
   load in the panel too (studio.js), so a form underneath keeps its input. #}
<div class="help-panel-head">
  <div>
    <p class="crumbs">{{ section }}</p>
    <h2>{{ page_title }}</h2>
  </div>
  <button type="button" class="icon-btn" data-help-close aria-label="Close help">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>
<div class="prose" data-help-panel-links>{{ body }}</div>
<div class="help-panel-foot">
  <a class="btn btn-sm" href="/studio/help/{{ slug }}" target="_blank" rel="noopener">Open in a new tab</a>
  <a class="btn btn-sm" href="/studio/help" target="_blank" rel="noopener">The whole manual</a>
</div>
