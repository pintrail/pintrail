[package]
name = "pintrail-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Opt in after the separate pgvector schema is installed.
semantic-search = ["dep:pintrail-embeddings"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
pintrail-storage.workspace = true
pintrail-embeddings = { workspace = true, features = ["postgres"], optional = true }
axum.workspace = true
axum-extra.workspace = true
chrono.workspace = true
dotenvy.workspace = true
hex.workspace = true
minijinja.workspace = true
rpassword.workspace = true
time.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
reqwest.workspace = true
image.workspace = true
webp.workspace = true
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[dev-dependencies]
pintrail-embeddings = { workspace = true, features = ["test-provider"] }
tower = { version = "0.5", features = ["util"] }
