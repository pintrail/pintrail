# Local development dependencies for the Rust backend.
#
# Postgres is both the datastore and the job queue (SKIP LOCKED, see
# docs/DESIGN.md section 2.5) -- there is deliberately no Redis here.
# MinIO stands in for S3 so presigned upload/download URLs can be exercised
# locally exactly as they behave against S3 or R2 in production.

name: pintrail-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pintrail
      POSTGRES_PASSWORD: pintrail
      POSTGRES_DB: pintrail
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pintrail -d pintrail"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pintrail
      MINIO_ROOT_PASSWORD: pintrail-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the media bucket on first boot so the API has somewhere to issue
  # presigned URLs against. Exits once done.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 pintrail pintrail-dev-secret &&
      mc mb --ignore-existing local/pintrail-media &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  miniodata:
