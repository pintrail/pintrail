[package]
name = "pintrail-embeddings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Enables a predictable substitute for integration tests, never a production model.
test-provider = []
postgres = ["dep:sqlx", "dep:uuid", "dep:sha2", "dep:serde_json", "dep:tokio"]

[dependencies]
fastembed.workspace = true
serde.workspace = true
thiserror.workspace = true
hf-hub = { version = "0.5", default-features = false }
sqlx = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
dotenvy.workspace = true
serde_json.workspace = true
toml = "0.9"
tokio.workspace = true

[[example]]
name = "postgres_search"
required-features = ["postgres"]
