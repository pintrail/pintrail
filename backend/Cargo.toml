[workspace]
resolver = "2"
members = ["services/pintrail-api", "services/pintrail-worker"]

# Shared across both binaries so the API and worker never disagree about
# how a row is deserialized or how the queue is polled.
[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
rpassword = "7"
time = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.94.1"   # floor set by aws-sdk-s3
