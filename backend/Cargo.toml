[workspace]
resolver = "2"
members = ["libs/pintrail-storage", "services/pintrail-api", "services/pintrail-worker"]

# Shared across both binaries so the API and worker never disagree about
# how a row is deserialized or how the queue is polled.
[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
minijinja = { version = "2", features = ["loader"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
pintrail-storage = { path = "libs/pintrail-storage" }
webp = "0.3"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
rpassword = "7"
time = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.94.1"   # floor set by aws-sdk-s3

# Image decoding, resizing, and WebP encoding are unusably slow in an
# unoptimized build -- a single 3000x1500 Lanczos3 resize takes tens of
# seconds, which makes the worker impossible to exercise in development.
# Optimizing just these dependencies keeps our own crates debuggable while
# making processing realistic.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.webp]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
