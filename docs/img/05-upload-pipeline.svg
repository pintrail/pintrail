<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc">
  <title id="title">How an author's upload becomes phone-ready media</title>
  <desc id="desc">The author asks the server for a signed upload link, uploads the original file straight to the media store, and the server records a queued job in the database. A worker claims the job, converts the file, writes the result back to the media store, and marks the job processed.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2933; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 14px; fill: #52606D; }
    .name { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #52606D; }
    .msg { font-size: 13px; }
    .n { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .pill { font-size: 12.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3E4C59"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9AA5B1"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#FFFFFF"/>
  <text class="title" x="30" y="42">From upload to phone-ready media</text>
  <text class="sub" x="30" y="66">Files never pass through the server; a background worker converts them.</text>

  <!-- boxes -->
  <rect x="30" y="130" width="190" height="70" rx="10" fill="#E8F1FB" stroke="#2B6CB0"/>
  <text class="name" x="125" y="160" text-anchor="middle">Author</text>
  <text class="small" x="125" y="180" text-anchor="middle">in the Studio (browser)</text>

  <rect x="355" y="130" width="190" height="70" rx="10" fill="#E8F1FB" stroke="#2B6CB0"/>
  <text class="name" x="450" y="160" text-anchor="middle">Pintrail server</text>
  <text class="small" x="450" y="180" text-anchor="middle">pintrail-api</text>

  <rect x="680" y="130" width="190" height="70" rx="10" fill="#F1ECFB" stroke="#6B46C1"/>
  <text class="name" x="775" y="160" text-anchor="middle">Media store</text>
  <text class="small" x="775" y="180" text-anchor="middle">originals + processed</text>

  <rect x="355" y="310" width="190" height="70" rx="10" fill="#F5F7FA" stroke="#7B8794"/>
  <text class="name" x="450" y="340" text-anchor="middle">Database</text>
  <text class="small" x="450" y="360" text-anchor="middle">attachment rows = job queue</text>

  <rect x="680" y="310" width="190" height="70" rx="10" fill="#FDF3E1" stroke="#B7791F"/>
  <text class="name" x="775" y="340" text-anchor="middle">Worker</text>
  <text class="small" x="775" y="360" text-anchor="middle">pintrail-worker (1 or more)</text>

  <!-- 1: request link -->
  <path d="M220 165 H351" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <circle cx="240" cy="148" r="10" fill="#2B6CB0"/><text class="n" x="240" y="152" text-anchor="middle">1</text>
  <text class="msg" x="256" y="152">get upload link</text>

  <!-- 2: direct upload -->
  <path d="M125 130 V100 H775 V126" fill="none" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="300" cy="100" r="10" fill="#2B6CB0"/><text class="n" x="300" y="104" text-anchor="middle">2</text>
  <text class="msg" x="318" y="92">upload the original file directly (e.g. an iPhone HEIC photo)</text>

  <!-- 3: queued -->
  <path d="M450 200 V306" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="470" cy="240" r="10" fill="#2B6CB0"/><text class="n" x="470" y="244" text-anchor="middle">3</text>
  <text class="msg" x="486" y="238">record it:</text>
  <text class="msg" x="486" y="256">status "queued"</text>

  <!-- 4: claim -->
  <path d="M680 332 H549" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="570" cy="316" r="10" fill="#B7791F"/><text class="n" x="570" y="320" text-anchor="middle">4</text>
  <text class="msg" x="586" y="320">claim job</text>

  <!-- 6: mark processed -->
  <path d="M549 360 H680" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="570" cy="377" r="10" fill="#B7791F"/><text class="n" x="570" y="381" text-anchor="middle">6</text>
  <text class="msg" x="586" y="382">mark done</text>

  <!-- 5: convert -->
  <path d="M760 310 V204 M790 204 V306" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="722" cy="257" r="10" fill="#B7791F"/><text class="n" x="722" y="261" text-anchor="middle">5</text>
  <text class="msg" x="600" y="240">read original,</text>
  <text class="msg" x="600" y="258">write converted</text>
  <text class="msg" x="600" y="276">version</text>

  <!-- status strip -->
  <text class="small" x="30" y="428" font-weight="700" letter-spacing="0.08em">STATUS THE AUTHOR SEES</text>
  <rect x="30" y="442" width="120" height="32" rx="16" fill="#F5F7FA" stroke="#7B8794"/>
  <text class="pill" x="90" y="463" text-anchor="middle" fill="#3E4C59">queued</text>
  <path d="M152 458 H186" stroke="#9AA5B1" stroke-width="1.6" marker-end="url(#arrg)"/>
  <rect x="190" y="442" width="120" height="32" rx="16" fill="#FDF3E1" stroke="#B7791F"/>
  <text class="pill" x="250" y="463" text-anchor="middle" fill="#8D5B0F">processing</text>
  <path d="M312 458 H346" stroke="#9AA5B1" stroke-width="1.6" marker-end="url(#arrg)"/>
  <rect x="350" y="442" width="120" height="32" rx="16" fill="#E6F4EA" stroke="#2F855A"/>
  <text class="pill" x="410" y="463" text-anchor="middle" fill="#22543D">processed</text>
  <text class="small" x="482" y="463">or "failed", with the reason</text>

  <text class="small" x="30" y="500">Conversions: HEIC, JPEG, PNG become WebP (max 2048 px). PDFs get a page-one thumbnail. Audio and video come in v2.</text>
</svg>
