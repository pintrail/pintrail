<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Pintrail timeline and roadmap</title>
  <desc id="desc">April 2026 Earth Day launch on the Python system; July 2026 Rust rewrite merged; Fall 2026 current work on the mobile app and semantic search; version 1 as the complete app; version 2 with audio and video, BLE beacons, gamification, and new domains.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2933; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 14px; fill: #52606D; }
    .when { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
    .what { font-size: 15px; font-weight: 700; }
    .body { font-size: 12.5px; fill: #3E4C59; }
    .now { font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.08em; }
  </style>

  <rect width="960" height="360" fill="#FFFFFF"/>
  <text class="title" x="30" y="42">Where Pintrail has been and where it's going</text>
  <text class="sub" x="30" y="66">As of September 2026.</text>

  <!-- line -->
  <path d="M110 130 H480" stroke="#2F855A" stroke-width="4"/>
  <path d="M480 130 H860" stroke="#9AA5B1" stroke-width="3" stroke-dasharray="7 6"/>

  <!-- nodes -->
  <circle cx="110" cy="130" r="12" fill="#2F855A"/>
  <circle cx="295" cy="130" r="12" fill="#2F855A"/>
  <circle cx="480" cy="130" r="14" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="452" y="88" width="56" height="20" rx="10" fill="#2B6CB0"/><text class="now" x="480" y="102" text-anchor="middle">NOW</text>
  <circle cx="665" cy="130" r="11" fill="#FFFFFF" stroke="#7B8794" stroke-width="2.5"/>
  <circle cx="850" cy="130" r="11" fill="#FFFFFF" stroke="#7B8794" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- labels -->
  <text class="when" x="110" y="172" text-anchor="middle" fill="#2F855A">APRIL 2026</text>
  <text class="what" x="110" y="194" text-anchor="middle">Earth Day launch</text>
  <text class="body" x="110" y="216" text-anchor="middle">Python portal live at</text>
  <text class="body" x="110" y="234" text-anchor="middle">pintrail.cs.umass.edu;</text>
  <text class="body" x="110" y="252" text-anchor="middle">landing page, Instagram,</text>
  <text class="body" x="110" y="270" text-anchor="middle">pin-mapping at the table</text>

  <text class="when" x="295" y="172" text-anchor="middle" fill="#2F855A">JULY 2026</text>
  <text class="what" x="295" y="194" text-anchor="middle">Rust rewrite merged</text>
  <text class="body" x="295" y="216" text-anchor="middle">API, worker, trails,</text>
  <text class="body" x="295" y="234" text-anchor="middle">comments, admin panel,</text>
  <text class="body" x="295" y="252" text-anchor="middle">Studio, Docker deploy</text>

  <text class="when" x="480" y="172" text-anchor="middle" fill="#2B6CB0">FALL 2026</text>
  <text class="what" x="480" y="194" text-anchor="middle">Build out the app</text>
  <text class="body" x="480" y="216" text-anchor="middle">Mobile screens beyond</text>
  <text class="body" x="480" y="234" text-anchor="middle">the map; retire Python;</text>
  <text class="body" x="480" y="252" text-anchor="middle">semantic search and Q&amp;A</text>
  <text class="body" x="480" y="270" text-anchor="middle">(independent study)</text>

  <text class="when" x="665" y="172" text-anchor="middle" fill="#52606D">VERSION 1</text>
  <text class="what" x="665" y="194" text-anchor="middle">Full campus release</text>
  <text class="body" x="665" y="216" text-anchor="middle">Nearby alerts, artifact</text>
  <text class="body" x="665" y="234" text-anchor="middle">pages, trails, comments,</text>
  <text class="body" x="665" y="252" text-anchor="middle">sharing, moderation</text>

  <text class="when" x="850" y="172" text-anchor="middle" fill="#52606D">VERSION 2</text>
  <text class="what" x="850" y="194" text-anchor="middle">Richer and wider</text>
  <text class="body" x="850" y="216" text-anchor="middle">Audio and video;</text>
  <text class="body" x="850" y="234" text-anchor="middle">BLE beacons indoors;</text>
  <text class="body" x="850" y="252" text-anchor="middle">badges; museums,</text>
  <text class="body" x="850" y="270" text-anchor="middle">tours, other campuses</text>

  <!-- legend -->
  <circle cx="40" cy="330" r="7" fill="#2F855A"/><text class="body" x="54" y="334">done</text>
  <circle cx="110" cy="330" r="7" fill="#2B6CB0"/><text class="body" x="124" y="334">in progress</text>
  <circle cx="220" cy="330" r="7" fill="#FFFFFF" stroke="#7B8794" stroke-width="2"/><text class="body" x="234" y="334">planned</text>
</svg>
